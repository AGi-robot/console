name: Console checks
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: console
      - uses: actions/checkout@v4
        with:
          repository: AGi-robot/cypher
          ref: dev
          path: cypher
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AGi-robot/telepathy
          ref: dev
          path: telepathy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest ruff fastapi httpx uvicorn websockets PyYAML
      - run: ruff check --select F console/telepathic_management
      - run: python -m pytest -q console/test
        env:
          PYTHONPATH: console:cypher:telepathy
      - run: |
          node --check console/telepathic_management/telepathic_console/backend/static/script.js
          node --check console/telepathic_management/telepathic_console/backend/static/settings.js
          node --test console/test/test_canvas.cjs
